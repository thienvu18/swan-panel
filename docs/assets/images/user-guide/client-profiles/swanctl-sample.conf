# SwanPanel Linux Native swanctl.conf
# Place in /etc/swanctl/conf.d/swanpanel.conf

connections {
    swanpanel {
        remote_addrs = swan-panel
        vips = 0.0.0.0

        local {
            auth = pubkey
            certs = client.crt
            id = david-iphone-16-pro
        }

        remote {
            auth = pubkey
            id = %any
            cacerts = swanpanel-ca.crt
        }

        children {
            swanpanel-traffic {
                remote_ts = 0.0.0.0/0
                start_action = start
                dpd_action = restart
                close_action = none
                mode = tunnel
                esp_proposals = aes256gcm16-ecp384,aes256-sha256
            }
        }

        version = 2
        mobike = yes
        encap = yes
        proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
    }
}
