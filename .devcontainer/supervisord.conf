[unix_http_server]
file=/tmp/swanpanel-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/swanpanel-supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///tmp/swanpanel-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:strongswan]
command=/usr/sbin/ipsec start --nofork
directory=/workspace/swan-panel
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/sh /workspace/swan-panel/.devcontainer/start-backend.sh
directory=/workspace/swan-panel
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=/bin/sh /workspace/swan-panel/.devcontainer/start-vite.sh
directory=/workspace/swan-panel/ui
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
