name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify tag before publishing
    runs-on: ubuntu-24.04
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      ui_artifact_id: ${{ steps.ci.outputs.artifact_id }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require successful main CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: sh scripts/verify-release-ci.sh

  build:
    name: Linux ${{ matrix.arch }} (native musl, static CGO)
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      VERSION: ${{ github.ref_name }}
      OUTPUT: dist/swan-panel-linux-${{ matrix.arch }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Install native musl and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools binutils file

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.ui_artifact_id }}
          path: ui/dist/
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.ci_run_id }}

      - name: Verify embedded frontend bundle exists
        run: |
          test -s ui/dist/index.html
          find ui/dist/assets -type f -name '*.js' | grep -q .

      - name: Test Go on native ARM64 with CGO
        if: matrix.arch == 'arm64'
        env:
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: go test -count=1 ./...

      - name: Build + validate static release binary
        run: sh scripts/build-linux-static.sh

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: swan-panel-linux-${{ matrix.arch }}
          path: dist/swan-panel-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish Linux release with checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swan-panel-linux-*
          path: dist/
          merge-multiple: true

      - name: Verify both binaries and generate checksums
        run: |
          set -eu
          cd dist
          test -s swan-panel-linux-amd64
          test -s swan-panel-linux-arm64
          file swan-panel-linux-amd64 swan-panel-linux-arm64
          sha256sum swan-panel-linux-amd64 swan-panel-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SwanPanel ${{ github.ref_name }}"
          files: |
            dist/swan-panel-linux-amd64
            dist/swan-panel-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
