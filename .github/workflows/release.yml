name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag before publishing
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Install native C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend
        run: cd ui && npm ci

      - name: Test frontend
        run: cd ui && npm test

      - name: Build embedded frontend
        run: cd ui && npm run build

      - name: Verify production frontend build
        run: |
          test -s ui/dist/index.html
          find ui/dist/assets -type f -name '*.js' | grep -q .

      - name: Upload embedded frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: swan-panel-ui-dist
          path: ui/dist/
          if-no-files-found: error
          retention-days: 3

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          sh -n scripts/build-linux-static.sh
          sh -n scripts/check-dependencies.sh
          sh -n scripts/test-release-config.sh
          sh -n scripts/check-descriptive-test-names.sh

      - name: Enforce descriptive test naming
        run: sh scripts/check-descriptive-test-names.sh

      - name: Check release configuration invariants
        run: sh scripts/test-release-config.sh

      - name: Check reviewed dependencies
        run: sh scripts/check-dependencies.sh

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Go formatting
        run: |
          unformatted="$(gofmt -l embed.go embed_test.go $(find cmd internal -name '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: ./...

      - name: Go regression tests with CGO and race detector
        env:
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: go test -count=1 -race ./...

  vpn-integration:
    name: Verify real IKEv2, nftables and revocation
    needs: verify
    uses: ./.github/workflows/docker-integration.yml

  build:
    name: Linux ${{ matrix.arch }} (native musl, static CGO)
    needs: [verify, vpn-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      VERSION: ${{ github.ref_name }}
      OUTPUT: dist/swan-panel-linux-${{ matrix.arch }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Install native musl and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools binutils file

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download verified frontend assets
        uses: actions/download-artifact@v4
        with:
          name: swan-panel-ui-dist
          path: ui/dist/

      - name: Verify embedded frontend bundle exists
        run: |
          test -s ui/dist/index.html
          find ui/dist/assets -type f -name '*.js' | grep -q .

      - name: Test Go on native architecture with CGO
        env:
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: go test -count=1 ./...

      - name: Build + validate static release binary
        run: sh scripts/build-linux-static.sh

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: swan-panel-linux-${{ matrix.arch }}
          path: dist/swan-panel-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish Linux release with checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swan-panel-linux-*
          path: dist/
          merge-multiple: true

      - name: Verify both binaries and generate checksums
        run: |
          set -eu
          cd dist
          test -s swan-panel-linux-amd64
          test -s swan-panel-linux-arm64
          file swan-panel-linux-amd64 swan-panel-linux-arm64
          sha256sum swan-panel-linux-amd64 swan-panel-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SwanPanel ${{ github.ref_name }}"
          files: |
            dist/swan-panel-linux-amd64
            dist/swan-panel-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
