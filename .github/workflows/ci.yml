name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test + CGO SQLite + static Linux binary
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools binutils file

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate Dev Container configuration and LAN port mappings
        run: |
          node scripts/test-devcontainer-config.mjs
          docker compose -f .devcontainer/compose.yml config --quiet

      - name: Install frontend
        run: cd ui && npm ci

      - name: Frontend regression tests
        run: cd ui && npm test

      - name: Build embedded frontend
        run: cd ui && npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          sh -n scripts/build-linux-static.sh
          sh -n scripts/check-dependencies.sh
          sh -n scripts/test-release-config.sh
          sh -n scripts/check-descriptive-test-names.sh

      - name: Enforce descriptive test naming
        run: sh scripts/check-descriptive-test-names.sh

      - name: Check release configuration invariants
        run: sh scripts/test-release-config.sh

      - name: Check approved direct dependencies
        run: sh scripts/check-dependencies.sh

      - name: Verify tidy Go module files
        run: go mod tidy -diff

      - name: Go formatting
        run: |
          unformatted="$(gofmt -l embed.go embed_test.go $(find cmd internal -name '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: ./...

      - name: Run Go tests with race detector and CGO
        env:
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: go test -count=1 -race ./...

      - name: Enforce 80 percent Go integration coverage
        env:
          APP_ENV: test
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v value="$coverage" 'BEGIN {
            printf "Backend Go cross-package coverage: %.1f%%\n", value
            if ((value + 0) < 80) {
              print "Coverage below the required 80% threshold"
              exit 1
            }
          }'

      - name: Enforce 100 percent statement coverage for critical P1 flows
        env:
          APP_ENV: test
          SWANPANEL_REQUIRE_BUILT_UI: "1"
        run: |
          # First-initialization failure of the sync.Once PKI singleton must
          # run in its own process, with coverage captured and merged.
          SWANPANEL_TEST_ROOT_CA_UNAVAILABLE=1 go test -count=1 -coverpkg=./... -coverprofile=coverage-ca-unavailable.out -run '^TestUnavailableRootCAFailsClosedAcrossControlPlaneOperations$' ./internal/api
          awk 'NR==FNR {print;next} FNR>1 {print}' coverage.out coverage-ca-unavailable.out > coverage-critical.out
          sh scripts/check-p1-critical-coverage.sh coverage-critical.out

      - name: Build native static Linux AMD64 binary
        env:
          VERSION: ci
          OUTPUT: dist/swan-panel-linux-amd64
        run: sh scripts/build-linux-static.sh

      - name: Verify production Docker image builds with CGO SQLite
        run: docker build --pull --tag swan-panel:ci .

      - name: Smoke test release image binary
        run: |
          docker run --rm --entrypoint /usr/local/bin/swan-panel swan-panel:ci --version | grep -Fx 'SwanPanel dev'

      - name: Build VS Code Dev Container image
        run: docker compose -f .devcontainer/compose.yml build workspace
