name: Bug Report
description: Create a report to help us improve SwanPanel
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with SwanPanel. Please ensure you are not reporting a security vulnerability here. For security concerns, please see [SECURITY.md](https://github.com/thienvu18/swan-panel/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: SwanPanel Version & OS Environment
      description: Operating System, Linux distribution, kernel version, and SwanPanel release version.
      placeholder: Ubuntu 24.04 LTS, kernel 6.8.0, SwanPanel v0.0.1, strongSwan 5.9.13
    validations:
      required: true
  - type: dropdown
    id: client-platform
    attributes:
      label: Client Operating System (if applicable)
      options:
        - macOS (Native IKEv2 .mobileconfig)
        - iOS (Native IKEv2 .mobileconfig)
        - Windows 10/11 (Native IKEv2 PowerShell)
        - Linux (NetworkManager / swanctl)
        - Android (Native IKEv2)
        - Web Admin UI only
        - None / Core Daemon only
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Please paste any relevant logs from SwanPanel (`journalctl -u swan-panel`) or strongSwan (`journalctl -u strongswan`). Please redact private IPs and credentials.
      render: shell
    validations:
      required: false
