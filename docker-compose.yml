# ==============================================================================
# SwanPanel - Production Docker Compose Deployment
# https://github.com/thienvu18/swan-panel
# ==============================================================================

services:
  swan-panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: swan-panel:latest
    container_name: swan-panel
    restart: unless-stopped

    # Kernel capabilities required for IPsec packet routing and iptables/nftables
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # Port mappings for Web UI, Split-DNS, and native IKEv2/IPsec VPN
    # NOTE: On production Linux VPS, you may alternatively use `network_mode: host`
    # for direct kernel ESP (Protocol 50) handling.
    ports:
      - "${PORT:-8080}:8080/tcp"                    # SwanPanel Web Control Plane UI & REST API
      - "${HOST_DNS_PORT:-53}:53/udp"              # Internal Split-DNS Engine (set HOST_DNS_PORT if 53 is busy)
      - "${HOST_DNS_PORT:-53}:53/tcp"              # Split-DNS TCP Fallback
      - "${IKE_PORT:-500}:500/udp"                  # strongSwan IKEv2 Key Exchange
      - "${IPSEC_PORT:-4500}:4500/udp"              # strongSwan IPsec NAT-Traversal

    # Persistent storage volumes for database, TLS certificates, and configuration
    # Note: If running strongSwan directly on the host systemd, overlay with
    # deploy/docker/docker-compose.host-swan.yml to bind-mount /var/run/charon.vici
    volumes:
      - swanpanel_data:/var/lib/swan-panel
      - swanpanel_config:/etc/swan-panel

    environment:
      - PORT=8080
      - DNS_PORT=53
      - ENABLE_DNS=true
      - DB_PATH=/var/lib/swan-panel/swanpanel.db
      - VICI_SOCKET=/var/run/charon.vici
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-swanpanel-change-in-production-random-secret-key}

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  swanpanel_data:
    driver: local
  swanpanel_config:
    driver: local
